<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Slot Addams - Sito B</title>
<style>
  body { background: #1a0b2e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .machine { border: 2px solid #9d4edd; padding: 30px; border-radius: 15px; width: 380px; text-align: center; background: #10002b; box-shadow: 0 0 30px rgba(157, 78, 221, 0.3); }
  .balance-bar { background: #240046; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #e0aaff; }
  .reels { font-size: 50px; margin: 20px 0; background: #000; padding: 20px; border-radius: 10px; border: 1px solid #5a189a; letter-spacing: 10px; }
  .controls { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 20px; }
  select, button { padding: 12px 18px; font-size: 16px; border-radius: 8px; border: none; }
  select { background: #240046; color: #fff; border: 1px solid #7b2cbf; }
  button { background: linear-gradient(135deg, #9d4edd, #7b2cbf); color: #fff; font-weight: bold; cursor: pointer; flex: 1; }
  button:hover { background: linear-gradient(135deg, #b5179e, #7209b7); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #msg { margin-top: 15px; min-height: 22px; color: #ff9e00; font-weight: bold; }
</style>
</head>
<body>

  <div class="machine">
    <h2 style="margin-top:0; color:#e0aaff;">🕷️ THE ADDAMS SLOT 🖐️</h2>
    <div class="balance-bar">SALDO: € <span id="bal">1000.00</span></div>

    <div class="reels" id="reels">🕷️ 🖐️ ⚰️</div>

    <div class="controls">
      <select id="betSelect">
        <option value="0.20">Puntata € 0.20</option>
        <option value="0.50" selected>Puntata € 0.50</option>
        <option value="1.00">Puntata € 1.00</option>
        <option value="5.00">Puntata € 5.00</option>
      </select>
      <button id="spinBtn" onclick="gira()">GIRA</button>
    </div>
    <div id="msg">Fai il tuo gioco!</div>
  </div>

<script>
  let balance = 1000.00;
  let roundCounter = 100;
  const symbols = ['🕷️', '🖐️', '⚰️', '🕯️', '⚡'];

  function inviaAlPortale(payload) {
    if (window.parent) {
      window.parent.postMessage(payload, "*");
    }
  }

  function gira() {
    const bet = parseFloat(document.getElementById('betSelect').value);
    if (balance < bet) {
      document.getElementById('msg').innerText = "Saldo insufficiente!";
      return;
    }

    document.getElementById('spinBtn').disabled = true;
    document.getElementById('msg').innerText = "Rulli in movimento...";

    roundCounter++;
    const roundId = "RND_" + Date.now().toString().slice(-6) + "_" + roundCounter;

    // 1. Scala la puntata e invia evento BET
    balance = +(balance - bet).toFixed(2);
    document.getElementById('bal').innerText = balance.toFixed(2);

    inviaAlPortale({
      type: "BET",
      playerId: "PLAYER_1045",
      gameId: "addams_slot_demo",
      roundId: roundId,
      amount: bet,
      currency: "EUR",
      balanceAfter: balance
    });

    // Effetto rotazione veloce
    let ticks = 0;
    const timer = setInterval(() => {
      const s1 = symbols[Math.floor(Math.random() * symbols.length)];
      const s2 = symbols[Math.floor(Math.random() * symbols.length)];
      const s3 = symbols[Math.floor(Math.random() * symbols.length)];
      document.getElementById('reels').innerText = `${s1} ${s2} ${s3}`;
      ticks++;

      if (ticks >= 10) {
        clearInterval(timer);
        calcolaEsito(bet, roundId, s1, s2, s3);
      }
    }, 70);
  }

  function calcolaEsito(bet, roundId, s1, s2, s3) {
    let win = 0;
    if (s1 === s2 && s2 === s3) {
      win = +(bet * 10).toFixed(2);
    } else if (s1 === s2 || s2 === s3 || s1 === s3) {
      win = +(bet * 2).toFixed(2);
    }

    if (win > 0) {
      balance = +(balance + win).toFixed(2);
      document.getElementById('bal').innerText = balance.toFixed(2);
      document.getElementById('msg').innerText = `HAI VINTO € ${win.toFixed(2)}!`;

      // 2. Se c'è vincita, invia evento WIN sullo stesso roundId
      inviaAlPortale({
        type: "WIN",
        playerId: "PLAYER_1045",
        gameId: "addams_slot_demo",
        roundId: roundId,
        amount: win,
        currency: "EUR",
        balanceAfter: balance
      });
    } else {
      document.getElementById('msg').innerText = "Nessuna vincita, ritenta!";
    }

    document.getElementById('spinBtn').disabled = false;
  }
</script>

</body>
</html>
